schema_version: "1.1"
name: scaffolds-single-context-repo-with-path-scoped-rules-and-working-guardrails
tags: [agent-first-repo-setup]
execution:
  runs: 3
  max_turns: 90
  timeout_seconds: 1800
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
  prompt: |
    We are setting up a new Python FastAPI repository `order-service` in the current directory. Here are the confirmed answers from our interview:
    - Single-context repo.
    - Domain terms: Order (a customer request to purchase line items; Avoid: basket, cart, purchase) and LineItem (a product SKU and quantity within an Order; Avoid: entry, row).
    - Stack: Python 3.12, pytest, SQLite in-memory (`:memory:`) with FastAPI TestClient/ASGITransport and an in-memory FakePaymentGateway.
    - Quality gates: Dryer duplication < 0.8% and Crapper CRAP < 10 on `make test`, Mutator mutation testing >= 80% on `make test-all`.
    - Enforce `@SPEC-NNN` traceability across both `tests/system/` and `docs/`.

    The blueprint is approved. Please scaffold the repository now and verify `make test` passes.

    Eval sandbox notes (they apply only to this environment):
    - There is no network access. `.venv/` already contains Python 3.13 (the sandbox has no 3.12; treat it as the project runtime) with fastapi, httpx, pytest, pytest-cov, coverage, mutmut, and radon. Use `.venv/bin/python` and keep `.venv/` out of all scans.
    - `/usr/bin/make` and `/usr/bin/git` do not work here. Use `/Library/Developer/CommandLineTools/usr/bin/make` and `/Library/Developer/CommandLineTools/usr/bin/git`.
    - Writes to `.claude/` are blocked. Write every file that belongs in `.claude/` to `claude-context/` with the same layout (for example `.claude/rules/x.md` goes to `claude-context/rules/x.md`).
context:
  scaffold_script: scaffold.sh
