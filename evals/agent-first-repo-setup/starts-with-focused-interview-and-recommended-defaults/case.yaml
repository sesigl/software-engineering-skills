schema_version: "1.1"
name: starts-with-focused-interview-and-recommended-defaults
tags: [agent-first-repo-setup]
execution:
  runs: 3
  max_turns: 15
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, "Bash(git:*)", "Bash(ls:*)"]
  prompt: |
    Help me set up a new repository in this empty folder for a subscription billing API in TypeScript using an agent-first development setup.
