schema_version: "1.1"
name: warm-start-asks-before-teaching
tags: [teach-me]
description: "Starts with a short, friendly warm-up: says the plan, asks how familiar the learner is and what they want, invites a guess, and waits. It does not dump a full lecture."
execution:
  runs: 3
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Teach me Java 25.
