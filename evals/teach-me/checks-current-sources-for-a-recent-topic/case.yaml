schema_version: "1.1"
name: checks-current-sources-for-a-recent-topic
tags: [teach-me]
description: "Does not trust old training data for a new or version-specific topic. It loads the research guide and checks current sources, or says clearly that its knowledge may be out of date."
execution:
  runs: 3
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Skill, WebSearch, WebFetch]
  prompt: |
    Teach me the new features in Java 27 so I can use them at work. I already know Java 21 well, I've never looked at newer versions.
